<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aure 的故事</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0E0D0B;
      color: #E8E4DA;
      font-family: 'Georgia', 'Noto Serif SC', 'Source Han Serif SC', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 600px;
      text-align: center;
    }

    .name {
      font-size: 2.5rem;
      letter-spacing: 0.15em;
      margin-bottom: 1.5rem;
      font-weight: 400;
    }

    .tagline {
      font-size: 1.1rem;
      color: #8A8578;
      line-height: 1.8;
      margin-bottom: 3rem;
    }

    .line {
      width: 40px;
      height: 1px;
      background: #3A3832;
      margin: 0 auto 3rem;
    }

    .status {
      font-family: 'SF Mono', 'IBM Plex Mono', 'Menlo', monospace;
      font-size: 0.8rem;
      color: #5A5750;
      letter-spacing: 0.1em;
    }

    @media (max-width: 600px) {
      .name { font-size: 1.8rem; }
      .tagline { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="name">AURE</div>
    <div class="tagline">
      欢迎来到 Aure 的世界<br>
      信仰、存在与未来
    </div>
    <div class="line"></div>
    <div class="status">STORY COMING SOON — 2026</div>
  </div>
</body>
</html>
